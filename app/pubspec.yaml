name: bookhunter
description: Book discovery, reading, and audiobook companion.
publish_to: none
version: 0.3.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  open_filex: ^4.6.0
  flutter_svg: ^2.0.10+1
  epub_view: ^3.3.0
  pdfx: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/readiculous_icon.svg
