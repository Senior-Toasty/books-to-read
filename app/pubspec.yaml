name: bookhunter
description: Book discovery, reading, and audiobook companion.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  open_filex: ^4.6.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/readiculous_icon.svg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/readiculous_icon.png
  adaptive_icon_background: "#192F50"
  adaptive_icon_foreground: assets/readiculous_icon.png
