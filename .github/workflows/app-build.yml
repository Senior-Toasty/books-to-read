name: BookHunter App Builds

on:
  push:
    branches: ["main", "stage1/**"]
    paths:
      - "app/**"
      - "rust-core/**"
      - ".github/workflows/app-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "rust-core/**"
      - ".github/workflows/app-build.yml"
  workflow_dispatch:
  push_tags:
    - "v*"

permissions:
  contents: read

jobs:
  flutter-checks:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check Flutter project
        run: flutter pub get
        working-directory: app
      - run: flutter analyze --fatal-infos
        working-directory: app
      - run: flutter test
        working-directory: app

  rust-core:
    name: Rust core checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path rust-core/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust-core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust-core/Cargo.toml

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffolding
        run: |
          flutter create --project-name bookhunter --org com.bookhunter --platforms android --no-pub /tmp/bookhunter-platforms
          cp -a /tmp/bookhunter-platforms/android app/android
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: BookHunter-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform scaffolding
        run: |
          flutter create --project-name bookhunter --org com.bookhunter --platforms ios --no-pub /tmp/bookhunter-platforms
          cp -a /tmp/bookhunter-platforms/ios app/ios
      - run: flutter pub get
        working-directory: app
      - run: flutter build ipa --release --no-codesign
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: BookHunter-iOS-IPA-Unsigned
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach APK and IPA to GitHub Release
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: BookHunter-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
