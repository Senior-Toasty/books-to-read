name: BookHunter CI

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "src/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "src/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookhunter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Format and verify Rust sources
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
      - name: Build release binary
        run: cargo build --release
      - name: Save rustfmt output for repository update
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookhunter-formatted-source
          path: src/main.rs
          retention-days: 1
