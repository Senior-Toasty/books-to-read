name: BookHunter CI

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "src/**"
      - "scripts/**"
      - "BOOKHUNTER.md"
      - "README2.md"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "src/**"
      - "scripts/**"
      - "BOOKHUNTER.md"
      - "README2.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookhunter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Format and verify Rust sources
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
      - name: Test download packaging safety rules
        run: |
          python3 -m py_compile scripts/package_legal_downloads.py
          python3 -m unittest discover -s scripts -p "test_*.py" -v
      - name: Build release binary
        run: cargo build --release
      - name: Smoke-test the BookHunter CLI
        run: cargo run --release -- --help
      - name: Run a one-book catalogue smoke search
        run: |
          cargo run --release -- --book-id 8 --sources open-library --concurrency 1 --retry-failed --output smoke-reports
          test -s smoke-reports/bookhunter-results.html
          test -s smoke-reports/bookhunter-results.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("smoke-reports/bookhunter-results.json").read_text())
          assert report["total_books"] == 164, report
          assert report["searched_books"] == 1, report
          assert report["searched_book_ids"] == [8], report
          assert not report["errors"], report["errors"]
          html = Path("smoke-reports/bookhunter-results.html").read_text()
          assert "Not searched in this run" in html
          csv_header = Path("smoke-reports/bookhunter-results.csv").read_text().splitlines()[0]
          assert csv_header.startswith("book_id,book_title,book_author,source"), csv_header
          print(f"Smoke search completed: {len(report['hits'])} catalogue matches, correct partial-list labels, and no provider errors.")
          PY
      - name: Upload one-book smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookhunter-smoke-report
          path: smoke-reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Save rustfmt output for repository update
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookhunter-formatted-source
          path: src/main.rs
          retention-days: 1
